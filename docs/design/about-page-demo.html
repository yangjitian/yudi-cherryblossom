<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>关于我</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500&family=Cormorant+Garamond:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f7f4ee;
    --ink:#2f2b27;
    --ink-soft:#6b645c;
    --muted:#ada396;
    --line:#e6ddd0;
    --pink:#e6a3b7;
    --blue:#5fa3b8;
    --blue-deep:#3f8ba1;
    --card-bg:#fffdfb;
    --shadow: 0 20px 44px -22px rgba(47,43,39,.38);
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans SC', sans-serif;
    font-weight:300;
    line-height:1.9;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }

  .deco-dot{
    position:absolute; width:6px; height:6px; border-radius:50%;
    background:var(--pink); opacity:.55;
  }

  .page{
    max-width:820px;
    margin:0 auto;
    padding:64px 32px 120px;
    position:relative;
  }

  /* ---------- 顶部：标题 + 头像/姓名 同行 ---------- */
  .page-head-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
    flex-wrap:wrap;
  }

  .title-block h1{
    font-family:'Noto Serif SC', serif;
    font-weight:500;
    font-size:34px;
    margin:0 0 6px;
    letter-spacing:.02em;
  }
  .title-block .eyebrow{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:18px;
    color:var(--muted);
    letter-spacing:.03em;
  }

  .identity-block{
    display:flex;
    align-items:center;
    gap:14px;
    margin-right:52px;
  }
  .avatar{
    width:64px; height:64px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(150deg, var(--blue) 0%, var(--pink) 100%);
    box-shadow:var(--shadow);
    flex:0 0 auto;
  }
  .avatar span{
    font-family:'Noto Serif SC', serif;
    font-size:23px;
    color:#fff;
    font-weight:500;
  }
  .id-text{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
  }
  .id-text .name{
    font-family:'Noto Serif SC', serif;
    font-size:17px;
    font-weight:500;
    color:var(--ink);
    line-height:1.3;
  }
  .id-text .name-sub{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:12px;
    color:var(--muted);
  }

  hr.divider{
    border:none;
    border-top:1px solid var(--line);
    margin:32px 0 40px;
  }

  /* ---------- 正文：简介 + 联系方式 ---------- */
  .section-label{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:18px;
  }
  .section-label .dash{
    width:28px; height:1px;
    background:var(--pink);
  }
  .section-label .text{
    font-family:'Noto Serif SC', serif;
    font-size:19px;
    font-weight:500;
    letter-spacing:.15em;
    color:var(--ink-soft);
  }

  .bio{
    font-size:15px;
    color:var(--ink-soft);
    max-width:62ch;
    margin:0 0 32px;
  }

  .contact-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:22px;
    margin-top:64px;
    padding-top:32px;
    border-top:1px solid var(--line);
  }

  .contact-item{
    display:inline-flex;
    align-items:center;
    text-decoration:none;
    color:var(--ink-soft);
    position:relative;
    cursor:pointer;
  }

  .icon-wrap{
    width:36px; height:36px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:#fff;
    border:1px solid var(--line);
    transition:transform .25s ease, box-shadow .25s ease, border-color .25s ease;
  }
  .contact-item:hover .icon-wrap{
    transform:translateY(-2px);
    box-shadow:0 10px 20px -12px rgba(47,43,39,.3);
    border-color:var(--blue);
  }
  .icon-wrap svg{ width:18px; height:18px; }

  /* ---------- 悬浮/点击信息卡片（邮箱 & 微信共用样式） ---------- */
  .info-card{
    position:absolute;
    bottom:calc(100% + 12px);
    left:50%;
    transform:translate(-50%, 6px);
    background:var(--card-bg);
    border-radius:14px;
    box-shadow:var(--shadow);
    text-align:center;
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition:opacity .22s ease, transform .22s ease, visibility .22s;
    z-index:10;
  }
  .info-card::after{
    content:"";
    position:absolute;
    top:100%; left:50%;
    transform:translateX(-50%);
    border:7px solid transparent;
    border-top-color:var(--card-bg);
  }
  .contact-item:hover .info-card,
  .contact-item.is-active .info-card{
    opacity:1;
    visibility:visible;
    transform:translate(-50%, 0);
    pointer-events:auto;
  }

  .email-card{
    width:220px;
    padding:16px 16px 14px;
  }
  .email-text{
    font-size:13.5px;
    color:var(--ink);
    word-break:break-all;
    margin-bottom:10px;
  }
  .copy-btn{
    font-family:'Noto Sans SC', sans-serif;
    font-size:12px;
    color:var(--blue-deep);
    background:#fff;
    border:1px solid var(--line);
    border-radius:999px;
    padding:5px 16px;
    cursor:pointer;
    transition:background .2s ease, color .2s ease, border-color .2s ease;
  }
  .copy-btn:hover{ border-color:var(--blue-deep); }
  .copy-btn.copied{
    background:var(--blue-deep);
    border-color:var(--blue-deep);
    color:#fff;
  }

  .wechat-card{
    width:168px;
    padding:16px 16px 12px;
  }
  .qr-fake{
    width:120px; height:120px;
    margin:0 auto 8px;
    border-radius:8px;
    background:
      repeating-conic-gradient(#2f2b27 0% 25%, #fff 0% 50%),
      #fff;
    background-size: 12px 12px, auto;
    border:1px solid var(--line);
    position:relative;
  }
  .qr-fake::before{
    content:"";
    position:absolute; inset:38%;
    background:#fff; border:2px solid #2f2b27;
  }
  .qr-caption{
    font-size:11px;
    color:var(--muted);
    line-height:1.5;
  }

  /* ---------- 移动端 ---------- */
  @media (max-width:640px){
    .page{ padding:48px 22px 100px; }
    .page-head-row{ flex-direction:column; align-items:center; text-align:center; gap:18px; }
    .title-block{ text-align:center; }
    .identity-block{ margin-right:0; }
    .id-text{ align-items:center; }
    .bio{ max-width:none; text-align:center; }
    .section-label{ justify-content:center; }
    .contact-row{ justify-content:center; }
  }
</style>
</head>
<body>

  <div class="deco-dot" style="top:24px; right:12%;"></div>
  <div class="deco-dot" style="top:4px; left:8%; width:4px; height:4px;"></div>

  <div class="page">

    <div class="page-head-row">
      <div class="title-block">
        <h1>关于我</h1>
        <div class="eyebrow">About</div>
      </div>

      <div class="identity-block">
        <div class="avatar"><span>雨</span></div>
        <div class="id-text">
          <span class="name">雨滴</span>
          <span class="name-sub">/ yudi</span>
        </div>
      </div>
    </div>

    <hr class="divider" />

    <div class="section-label">
      <span class="dash"></span>
      <span class="text">简介</span>
    </div>
    <p class="bio">
      这里是简介占位文字，用于预览排版效果 —— 计算机科学与技术专业在读，具体自我介绍文案后续再定，不影响本次布局与交互的确认。
    </p>

    <div class="contact-row">

      <!-- 邮箱：仅图标，悬浮/点击弹出地址卡片，可复制 -->
      <div class="contact-item has-card" id="emailItem">
        <span class="icon-wrap">
          <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="3" fill="#f3d7a8" stroke="#c98f3c" stroke-width="1.2"/><path d="M3.5 6.2l8.5 6.6 8.5-6.6" stroke="#c98f3c" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <div class="info-card email-card">
          <div class="email-text">2804023636@qq.com</div>
          <button class="copy-btn" data-copy="2804023636@qq.com">复制</button>
        </div>
      </div>

      <!-- GitHub：仅图标，点击新标签跳转 -->
      <a class="contact-item github" href="https://github.com/yangjitian" target="_blank" rel="noopener">
        <span class="icon-wrap">
          <svg viewBox="0 0 16 16" fill="#181717"><path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        </span>
      </a>

      <!-- 微信：仅图标，悬浮/点击弹出二维码卡片 -->
      <div class="contact-item has-card" id="wechatItem">
        <span class="icon-wrap">
          <svg viewBox="0 0 24 24" fill="#07C160"><path d="M9.2 3.6c-4 0-7.2 2.75-7.2 6.14 0 1.94 1.06 3.65 2.72 4.79-.13.43-.5 1.63-.57 1.88-.09.31.11.3.24.22.1-.06 1.62-1.07 2.28-1.5.5.14 1.02.22 1.55.24-.08-.36-.12-.73-.12-1.1 0-3.24 3.13-5.86 6.98-5.86.24 0 .47.01.7.03C15.4 5.9 12.6 3.6 9.2 3.6zm-2.5 3.9c.55 0 1 .43 1 .96 0 .53-.45.96-1 .96s-1-.43-1-.96c0-.53.45-.96 1-.96zm5 0c.55 0 1 .43 1 .96 0 .53-.45.96-1 .96s-1-.43-1-.96c0-.53.45-.96 1-.96z"/><path d="M15.5 10.3c-3.3 0-5.9 2.19-5.9 4.9 0 2.7 2.6 4.9 5.9 4.9.46 0 .9-.05 1.33-.13.55.35 1.78 1.13 1.87 1.18.11.07.28.08.2-.2-.06-.21-.36-1.19-.47-1.56 1.36-.94 2.27-2.37 2.27-4.19 0-2.71-2.6-4.9-5.9-4.9zm-2.05 3.2c.46 0 .83.36.83.8 0 .44-.37.8-.83.8-.46 0-.83-.36-.83-.8 0-.44.37-.8.83-.8zm4.1 0c.46 0 .83.36.83.8 0 .44-.37.8-.83.8-.46 0-.83-.36-.83-.8 0-.44.37-.8.83-.8z"/></svg>
        </span>
        <div class="info-card wechat-card">
          <div class="qr-fake"></div>
          <div class="qr-caption">微信扫码加我<br/>（示例二维码，占位）</div>
        </div>
      </div>

    </div>

  </div>

  <script>
    // 邮箱 / 微信：点击图标切换卡片显示（用于触屏无 hover 场景），点击其他地方关闭
    document.querySelectorAll('.contact-item.has-card > .icon-wrap').forEach(icon => {
      icon.addEventListener('click', (e) => {
        e.stopPropagation();
        const item = icon.parentElement;
        const wasActive = item.classList.contains('is-active');
        document.querySelectorAll('.contact-item.is-active').forEach(el => el.classList.remove('is-active'));
        if (!wasActive) item.classList.add('is-active');
      });
    });
    document.addEventListener('click', () => {
      document.querySelectorAll('.contact-item.is-active').forEach(el => el.classList.remove('is-active'));
    });

    // 复制邮箱
    document.querySelectorAll('.copy-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const text = btn.dataset.copy;
        navigator.clipboard.writeText(text).then(() => {
          const original = btn.textContent;
          btn.textContent = '已复制';
          btn.classList.add('copied');
          setTimeout(() => {
            btn.textContent = original;
            btn.classList.remove('copied');
          }, 1500);
        });
      });
    });
  </script>

</body>
</html>
