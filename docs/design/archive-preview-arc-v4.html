<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>归档 · 雨滴·手记</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Noto+Serif+SC:wght@400;600&family=Noto+Sans+SC:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    /* 以下变量与首页 blog-homepage-prototype-v6.html 完全一致，
       方便以后两个页面共用同一份主题样式表，不用维护两套配色系统。
       归档页原来的变量名（--bg/--ink/--sakura 等）和首页刚好同名，
       这里直接替换成首页的数值，未在归档页出现过的变量
       （比如 --bg-raised、--lake-text）一并带过来，方便后续复用。 */
    --bg: #F7F6F3;
    --bg-raised: #FFFFFF;
    --ink: #232326;
    --ink-soft: #6E6E72;
    --ink-faint: #A6A4A0;
    --line: #E0DDD6;

    --sakura: #DB6E93;
    --sakura-soft: #FBE7ED;
    --sakura-text: #C4779A;

    --lake: #2E7A94;
    --lake-soft: #E5F1F4;
    --lake-text: #4E93A6;
  }

  html[data-theme="dark"] {
    --bg: #17171A;
    --bg-raised: #1E1E22;
    --ink: #ECECEE;
    --ink-soft: #97979C;
    --ink-faint: #5B5B60;
    --line: #2C2C30;

    --sakura: #F08FAE;
    --sakura-soft: #34232B;
    --sakura-text: #EBA2BC;

    --lake: #5FC2E0;
    --lake-soft: #1B323B;
    --lake-text: #82CBE2;
  }
  html, body {
    /* 弧形区域在滚轮交互时会主动 preventDefault 阻止页面滚动，
       但部分浏览器在满足"整页可滚动 + 光标位于可滚动子区域"时，
       仍可能出现滚动链（scroll chaining）把事件的默认行为向上传递。
       给 html/body 加 overscroll-behior，从根上切断这种链式传递，
       避免子区域阻止失败时页面仍然跟着滚动。 */
    overscroll-behavior: none;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Noto Sans SC",sans-serif; padding:64px 24px;
  }
  /* 标题区域跟下面的 .archive 用同一个 max-width + margin:0 auto，
     两者才会共享同一条左边界。之前 h1/.sub 是独立的两个块级元素，
     贴着 body 的 padding 顶格显示，而 .archive 是单独居中的，
     宽屏下页面中间就会留出空当，看起来标题和下面的圆弧轴对不齐。 */
  .page-head {
    max-width: 960px;
    margin: 0 auto;
  }
  h1{
    font-family:"Fraunces","Noto Serif SC",serif; font-weight:500;
    font-size:34px; margin:0 0 8px; letter-spacing:.02em;
  }
  .sub{color:var(--ink-faint); font-size:13px; margin-bottom:52px}

  .archive{
    max-width:960px; margin:0 auto; display:grid;
    /* 第一列宽度不写死数字，改用 CSS 变量 --arc-col-w，
       由 JS 在初始化时根据实际的弧半径 R 计算后写入
       （见下方 JS 里的 document.documentElement.style.setProperty）。
       这样以后调整 R 只需要改一个地方，不会再出现
       "月份列被放大后的年份数字压住"这种布局和坐标计算脱节的问题。 */
    grid-template-columns: var(--arc-col-w, 260px) 160px 1fr; gap:48px;
  }

  /* ── 圆弧年份轴：更瘦高的比例（大半径 + 收窄的分布角度）── */
  .arc-wrap{
    position:relative; height:620px; touch-action:none; cursor:ns-resize; user-select:none;
    overscroll-behavior: contain; /* 弧形自身也切断滚动链，双重保险 */
  }
  .arc-wrap:active{cursor:grabbing}
  .arc-wrap svg{position:absolute; left:0; top:0; overflow:visible; pointer-events:none}
  .year-item{
    position:absolute; left:0; top:0; background:none; border:none; cursor:pointer;
    font-family:"Fraunces",serif; color:var(--ink-faint);
    padding:2px 6px; white-space:nowrap;
    /* 位置改用 transform 由 JS 每帧直接赋值，不经过 CSS transition，
       避免拖动时位置更新和过渡动画互相打架造成的滞后感；
       只有颜色/字号/字重这些非几何属性保留过渡，视觉上更顺滑 */
    transition:color .25s, font-size .25s, font-weight .25s;
    will-change: transform;
  }
  .year-item.active{color:var(--sakura); font-weight:600}
  .hint{position:absolute; bottom:-2px; left:4px; font-size:10.5px; color:var(--ink-faint)}

  .col-wrap{height:620px; display:flex; flex-direction:column; justify-content:center}

  .months{display:flex; flex-direction:column; gap:4px}
  .month-item{
    background:none; border:none; cursor:pointer; text-align:left;
    font-family:"Noto Serif SC",serif; font-size:15px; color:var(--ink-soft);
    padding:7px 10px; border-radius:6px; transition:background .2s,color .2s;
    opacity:0; transform:translateY(4px); animation:rise .3s forwards;
  }
  .month-item:hover{background:var(--lake-soft); color:var(--ink)}
  .month-item.active{background:var(--lake-soft); color:var(--lake); font-weight:600}
  @keyframes rise{to{opacity:1; transform:translateY(0)}}

  .posts{display:flex; flex-direction:column; gap:12px}
  .post-title{
    font-family:"Noto Serif SC",serif; font-size:15px; color:var(--ink-soft);
    text-decoration:none; border-bottom:1px solid transparent; width:fit-content;
    opacity:0; transform:translateY(4px); animation:rise .3s forwards;
  }
  .post-title:hover{color:var(--ink); border-color:var(--sakura-soft)}
  .empty-hint{color:var(--ink-faint); font-size:13.5px}

  @media (max-width: 720px) {
    .archive { grid-template-columns: 110px 130px 1fr; gap: 16px; }
    .arc-wrap, .col-wrap { height: 480px; }
  }
</style>
</head>
<body>

<div class="page-head">
  <h1>归档</h1>
  <div class="sub">鼠标悬停滚动圆弧（也支持拖拽）—— 年份滑到中间自动展开对应内容</div>
</div>

<div class="archive">
  <div class="arc-wrap" id="arcWrap">
    <svg id="arcSvg" width="150" height="620"></svg>
    <div class="hint">滚轮 / 拖动</div>
  </div>
  <div class="col-wrap"><div class="months" id="months"></div></div>
  <div class="col-wrap"><div class="posts" id="posts"></div></div>
</div>

<script>
const DATA = {
  2026: { "3月": ["给 Halo 主题接入无限滚动的几个坑", "重新设计归档页的排版逻辑"], "1月": ["Java 并发面试整理：从 synchronized 到 AQS"] },
  2025: { "11月": ["杭州实习的第一个高并发问题排查记录", "读《人月神话》：进度不是线性的"], "6月": ["从 Java 转 Python：一些踩过的坑"] },
  2024: { "9月": ["大二上：把课程笔记搬到自己的博客"] },
  2023: { "4月": ["刚学 Java 时踩过的第一个 NPE"] },
  2022: { "10月": ["高考后决定学计算机的那个夏天"] },
};

const years = Object.keys(DATA);
const N = years.length;
const arcWrap = document.getElementById('arcWrap');
const svg = document.getElementById('arcSvg');
const monthsEl = document.getElementById('months');
const postsEl = document.getElementById('posts');

// ── 弧形比例：加大半径 + 收窄分布角度，让弧看起来更瘦高 ──
const R = 180;              // 弧半径：从 120 加大到 180
const H = 620;               // 容器高度：从 440 拉到 620，配合更大的半径
const CY = H / 2;
const SPAN = 110;            // 年份分布角度：从 150° 收窄到 110°，年份纵向排布更密集
const step = N > 1 ? SPAN / (N - 1) : 0;

// 把 .archive 第一列的宽度和 R 挂钩，而不是在 CSS 里写死一个数字。
// 年份转到弧形正中间（角度接近 0）时，x 坐标会接近 R 本身，
// 激活态字号放大后还要再占出约 70px 的视觉宽度，
// 所以列宽 = R + 半个字宽 + 一点安全余量，任何时候调整 R
// 这里都会自动跟着变，不会再出现放大的年份数字把月份列压住的问题。
const ARC_COL_WIDTH = Math.ceil(R + 70 + 20);
document.documentElement.style.setProperty('--arc-col-w', ARC_COL_WIDTH + 'px');

// ── 关键修复：夹紧范围必须覆盖"让首/尾年份居中"所需的最大旋转角度 ──
// 之前的写法 MARGIN = step * 1.2 只给了一点点余量，
// 但居中第一个/最后一个年份需要的 rotation 是 ±(SPAN/2)，
// 旧的 MARGIN 远小于这个值，导致 clampRotation 和 animateRotationTo
// 把目标角度截断，首尾年份永远无法真正转到中心 —— 这是滑不到 2022/2026 的根因。
// 这里额外再加一点缓冲（半个 step），让首尾年份居中后还能继续拖出一点点余量，手感更自然。
const MARGIN = SPAN / 2 + step * 0.5;

let rotation = 0;
let activeIndex = 0;
const items = [];

// 圆心在 (0, CY)，只画一次的真实圆弧轨道（非折线）
function drawTrack(){
  const total = SPAN + 2 * (step * 0.5 + 10); // 轨道略长于可拖动范围，视觉上留有余地
  const a1 = (-total/2) * Math.PI/180, a2 = (total/2) * Math.PI/180;
  const x1 = R*Math.cos(a1), y1 = CY + R*Math.sin(a1);
  const x2 = R*Math.cos(a2), y2 = CY + R*Math.sin(a2);
  const largeArc = total > 180 ? 1 : 0;
  svg.innerHTML = `<path d="M ${x1.toFixed(1)} ${y1.toFixed(1)} A ${R} ${R} 0 ${largeArc} 1 ${x2.toFixed(1)} ${y2.toFixed(1)}"
                     fill="none" stroke="var(--line)" stroke-width="1.5"/>`;
}

years.forEach((y, i) => {
  const btn = document.createElement('button');
  btn.className = 'year-item';
  btn.textContent = y;
  // 点击改由 pointerup 里统一判定处理（见下方拖拽逻辑的说明），
  // 这里不再绑定 click——在 setPointerCapture 之下 click 事件本就
  // 不可靠，留着容易和 pointerup 里的手动判定重复触发。
  arcWrap.appendChild(btn);
  items.push(btn);
});

// 点击年份：立刻切换内容 + 转动弧形，两件事同时触发而不是等旋转动画跑完
// 再靠 render() 里的角度判定间接触发 —— 原来的写法点击后内容要等
// 动画接近尾声、角度足够接近目标年份时才会切换，中间有一段"点了没反应"
// 的空档；现在点击瞬间就把 activeIndex 和内容定下来，旋转动画只负责
// 视觉上把弧转过去，两者互不等待。
function selectYear(i){
  if (activeIndex !== i){
    activeIndex = i;
    loadYear(years[i]);
  }
  animateRotationTo(centerRotationFor(i));
}

function baseAngleDeg(i){ return -SPAN/2 + i*step; }
function angleDeg(i){ return baseAngleDeg(i) + rotation; }
function centerRotationFor(i){ return -baseAngleDeg(i); }

// ── 性能修复：改用 transform 定位，不再写 style.left/top ──
// style.left/top 会触发浏览器重新计算布局（layout/reflow），
// 拖动时每一帧都要对 5 个元素做一次布局计算，这是卡顿的直接原因。
// transform 只走合成层（compositor），不经过布局/绘制，
// GPU 加速下几乎零成本，这也是浏览器动画性能优化的标准做法。
function render(){
  let nearestIndex = 0, nearestDist = Infinity;
  for (let i = 0; i < N; i++){
    const a = angleDeg(i) * Math.PI / 180;
    const x = R * Math.cos(a);
    const y = CY + R * Math.sin(a);
    const isActive = i === activeIndex;
    const scale = isActive ? 1.25 : 1;
    items[i].style.transform = `translate(${x}px, ${y}px) translate(-50%, -50%) scale(${scale})`;
    items[i].style.fontSize = (isActive ? 22 : 14) + 'px';
    items[i].classList.toggle('active', isActive);

    const dist = Math.abs(angleDeg(i));
    if (dist < nearestDist){ nearestDist = dist; nearestIndex = i; }
  }
  if (nearestDist < step/2 && nearestIndex !== activeIndex){
    activeIndex = nearestIndex;
    loadYear(years[activeIndex]);
  }
}

function clampRotation(){ rotation = Math.max(-MARGIN, Math.min(MARGIN, rotation)); }

let raf = null;
function animateRotationTo(target, duration = 320){
  target = Math.max(-MARGIN, Math.min(MARGIN, target));
  const start = rotation, t0 = performance.now();
  if (raf) cancelAnimationFrame(raf);
  function step_(now){
    const t = Math.min(1, (now - t0) / duration);
    const eased = 1 - Math.pow(1 - t, 3);
    rotation = start + (target - start) * eased;
    render();
    if (t < 1) raf = requestAnimationFrame(step_);
  }
  raf = requestAnimationFrame(step_);
}

// ── 拖拽：记录最近几帧的速度，松手后按惯性继续滑行一段再吸附 ──
// 关键点：pointerdown 时用了 setPointerCapture 把后续指针事件都
// 强制路由到 arcWrap 身上，这样才能保证拖出 arcWrap 区域也能继续拖动。
// 但代价是——只要在弧形区域里按下过，哪怕只是想点一下年份按钮，
// 整个交互都会被当成"拖拽"处理，年份按钮自己的 click 事件不会触发，
// 这正是"点击年份没反应"的根因。
// 解法：记录按下到松开之间的实际移动距离，移动距离很小（判定为一次点击，
// 不是拖拽）时，不吸附/不触发惯性滑动，而是直接找出按下位置对应的
// 是哪个年份按钮，手动调用 selectYear —— 相当于把"点击"从"拖拽"里
// 剥离出来单独处理，而不是依赖浏览器原生 click 事件（它在指针捕获下
// 已经不可靠了）。
let dragging = false, lastY = 0, lastT = 0;
let velocity = 0; // 度/毫秒
let dragStartY = 0, dragMoved = 0;
const CLICK_THRESHOLD = 6; // 像素：移动距离小于这个值，判定为点击而不是拖拽

arcWrap.addEventListener('pointerdown', e => {
  dragging = true;
  lastY = e.clientY;
  lastT = performance.now();
  dragStartY = e.clientY;
  dragMoved = 0;
  velocity = 0;
  if (raf) cancelAnimationFrame(raf);
  arcWrap.setPointerCapture(e.pointerId);
});

window.addEventListener('pointerup', e => {
  if (!dragging) return;
  dragging = false;

  if (dragMoved < CLICK_THRESHOLD) {
    // 几乎没有移动 —— 当作一次点击处理。
    // 注意：由于 arcWrap 调用过 setPointerCapture，这次 pointerup 的
    // e.target 会被浏览器强制指向 arcWrap 本身，而不是鼠标实际落在的
    // 那个年份按钮（这是指针捕获机制的规定行为，不是 bug）——
    // 所以不能用 e.target 去找按钮，改成用鼠标的屏幕坐标反算出
    // 它离弧上的哪个年份位置最近，直接选中那个年份。
    const rect = arcWrap.getBoundingClientRect();
    const px = e.clientX - rect.left;
    const py = e.clientY - rect.top;
    // 弧心在 (0, CY)（相对 arcWrap 左边界的 x=0 处），算出点击点相对弧心的角度
    const clickAngle = Math.atan2(py - CY, px) * 180 / Math.PI;
    // 反解出这个角度对应 rotation=当前值时，是哪个年份索引的 baseAngle 离它最近
    let nearestIndex = 0, nearestDist = Infinity;
    for (let i = 0; i < N; i++){
      const d = Math.abs(angleDeg(i) - clickAngle);
      if (d < nearestDist){ nearestDist = d; nearestIndex = i; }
    }
    // 只有点击位置确实落在某个年份按钮附近（而不是弧线空白处或很远的地方）
    // 才响应，避免误触发
    if (nearestDist < step) {
      selectYear(nearestIndex);
    }
    return;
  }

  glideThenSnap();
});

window.addEventListener('pointermove', e => {
  if (!dragging) return;
  const now = performance.now();
  const dy = e.clientY - lastY;
  const dt = Math.max(1, now - lastT);
  const dRot = dy * 0.28;

  dragMoved += Math.abs(e.clientY - lastY);

  rotation += dRot;
  clampRotation();
  render();

  // 指数滑动平均，避免最后一帧的抖动被直接当成松手速度
  velocity = velocity * 0.7 + (dRot / dt) * 0.3;

  lastY = e.clientY;
  lastT = now;
});

// ── 滚轮：主要交互方式，鼠标悬停在弧上下滚动即可 ──
// 保留"连续旋转 + 停下后自动吸附"的手感，但相比拖拽单独调优：
// 1) deltaY 先做一次量级归一化，避免触控板（每次事件 deltaY 很小、但事件密集）
//    和鼠标滚轮（每次事件 deltaY 大、但事件稀疏）转出来的旋转速度差异很大；
// 2) 用同样的速度平滑记录滚动"势头"，滚动一停就顺着势头再滑一小段再吸附，
//    而不是滚轮一停就立刻硬吸附，连续滚动一长串时不会感觉在中途被打断；
// 3) 吸附前的等待时间比拖拽稍长一些（滚轮事件天然是一连串脉冲，
//    等待窗口太短会在快速滚动过程中不断误判"已经停下"而提前吸附）。
let wheelTimer = null;
let wheelVelocity = 0;
let lastWheelT = 0;

arcWrap.addEventListener('wheel', e => {
  // 只要事件允许被阻止就立刻阻止默认滚动行为，放在最前面第一时间执行，
  // 避免后面任何计算逻辑（哪怕只是同步代码）晚一拍才调用，
  // 被浏览器判定为"这次事件没有及时表态"而继续走默认滚动。
  if (e.cancelable) e.preventDefault();
  e.stopPropagation();

  if (raf) cancelAnimationFrame(raf);

  const now = performance.now();
  const dt = Math.max(1, now - lastWheelT);

  // deltaMode 0 = pixel（常见于触控板/精细滚轮），1 = line（常见于普通鼠标滚轮）；
  // 统一换算成大致等价的像素量级，避免不同输入设备的旋转速度差异过大
  const rawDelta = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
  // 系数从 0.045 提到 0.11：之前的灵敏度偏低，一次正常的滚轮滚动
  // （约 10 个滚动齿格）只能转出 45° 左右，而弧形从中心转到任意一端
  // 需要 55°、转完整个弧长需要 110°，滚动量根本不够把弧转到头，
  // 这正是"滚轮滑不到首尾年份"的根因——不是吸附逻辑的问题，
  // 是每次滚动能转动的角度本来就太小。调大后一次正常滚动手势
  // 基本可以从中心转到边界。
  const dRot = rawDelta * 0.11;

  rotation += dRot;
  clampRotation();
  render();

  wheelVelocity = wheelVelocity * 0.75 + (dRot / dt) * 0.25;
  lastWheelT = now;

  clearTimeout(wheelTimer);
  wheelTimer = setTimeout(wheelGlideThenSnap, 160);
}, { passive:false });

function wheelGlideThenSnap(){
  const GLIDE_FACTOR = 55;
  const projected = rotation + wheelVelocity * GLIDE_FACTOR;
  const clamped = Math.max(-MARGIN, Math.min(MARGIN, projected));
  const targetIndex = nearestIndexOf(clamped);
  wheelVelocity = 0;
  animateRotationTo(centerRotationFor(targetIndex), 380);
}

function nearestIndexOf(rot){
  let nearestIndex = 0, nearestDist = Infinity;
  for (let i = 0; i < N; i++){
    const d = Math.abs(baseAngleDeg(i) + rot);
    if (d < nearestDist){ nearestDist = d; nearestIndex = i; }
  }
  return nearestIndex;
}

function snapToNearest(){
  animateRotationTo(centerRotationFor(nearestIndexOf(rotation)));
}

// 松手后先按惯性继续滑一小段（速度越快滑得越远），再吸附到最近年份，
// 手感上更像是"甩出去"而不是硬生生停住
function glideThenSnap(){
  const GLIDE_FACTOR = 45; // 速度到滑行距离的换算系数，数值越大惯性感越强
  const projected = rotation + velocity * GLIDE_FACTOR;
  const clamped = Math.max(-MARGIN, Math.min(MARGIN, projected));
  const targetIndex = nearestIndexOf(clamped);
  animateRotationTo(centerRotationFor(targetIndex), 380);
}

function loadYear(year){
  monthsEl.innerHTML = '';
  postsEl.innerHTML = '<div class="empty-hint">选择一个月份查看文章</div>';
  const months = Object.keys(DATA[year]);
  months.forEach((m, i) => {
    const mbtn = document.createElement('button');
    mbtn.className = 'month-item';
    mbtn.textContent = m;
    mbtn.style.animationDelay = (i*40)+'ms';
    mbtn.addEventListener('click', () => selectMonth(year, m, mbtn));
    monthsEl.appendChild(mbtn);
  });
  if (months.length) selectMonth(year, months[0], monthsEl.children[0]);
}

function selectMonth(year, month, btn){
  document.querySelectorAll('.month-item').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  postsEl.innerHTML = '';
  DATA[year][month].forEach((title, i) => {
    const a = document.createElement('a');
    a.className = 'post-title';
    a.href = '#';
    a.textContent = title;
    a.style.animationDelay = (i*40)+'ms';
    postsEl.appendChild(a);
  });
}

drawTrack();
render();
loadYear(years[activeIndex]);
</script>
