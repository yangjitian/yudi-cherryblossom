<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>登录 / 注册 / 个人中心 · 设计 Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500&family=Cormorant+Garamond:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f7f4ee;
    --ink:#2f2b27;
    --ink-soft:#6b645c;
    --muted:#ada396;
    --line:#e6ddd0;
    --pink:#e6a3b7;
    --blue:#5fa3b8;
    --blue-deep:#3f8ba1;
    --card-bg:#fffdfb;
    --shadow: 0 20px 44px -22px rgba(47,43,39,.38);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans SC', sans-serif;
    font-weight:300;
    line-height:1.8;
    min-height:100vh;
    position:relative;
  }
  .deco-dot{ position:absolute; width:6px; height:6px; border-radius:50%; background:var(--pink); opacity:.5; }

  /* ---------- Demo 切换条（不是最终页面元素） ---------- */
  .demo-switch{
    position:sticky; top:0; z-index:50;
    display:flex; justify-content:center; gap:10px;
    padding:14px;
    background:rgba(247,244,238,.92);
    backdrop-filter:blur(6px);
    border-bottom:1px dashed var(--line);
  }
  .demo-switch button{
    font-family:'Noto Sans SC', sans-serif;
    font-size:13px;
    padding:7px 18px;
    border-radius:999px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .demo-switch button.active{
    background:var(--ink);
    color:#fff;
    border-color:var(--ink);
  }

  .view{ display:none; }
  .view.active{ display:block; }

  /* ================= 登录 / 注册：极简居中卡片，不带完整导航栏 ================= */
  .authpage{
    min-height:calc(100vh - 60px);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:60px 20px;
    position:relative;
  }
  .auth-card{
    width:100%;
    max-width:380px;
    background:var(--card-bg);
    border-radius:20px;
    box-shadow:var(--shadow);
    padding:40px 36px 34px;
    text-align:center;
  }
  .auth-brand{
    font-family:'Noto Serif SC', serif;
    font-size:22px;
    font-weight:500;
    margin-bottom:4px;
  }
  .auth-brand .dot{ color:var(--pink); }
  .auth-tagline{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:14px;
    color:var(--muted);
    margin-bottom:28px;
  }
  .auth-field{
    text-align:left;
    margin-bottom:16px;
  }
  .auth-field label{
    display:block;
    font-size:12px;
    color:var(--muted);
    letter-spacing:.05em;
    margin-bottom:6px;
  }
  .auth-field input{
    width:100%;
    height:40px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--paper);
    padding:0 14px;
    font-size:14px;
    color:var(--ink);
    outline:none;
    font-family:'Noto Sans SC', sans-serif;
    transition:border-color .2s ease;
  }
  .auth-field input:focus{ border-color:var(--blue); }

  .auth-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:12.5px;
    color:var(--ink-soft);
    margin:4px 0 24px;
  }
  .auth-row label{ display:flex; align-items:center; gap:6px; cursor:pointer; }
  .auth-row a{ color:var(--blue-deep); text-decoration:none; }

  .auth-submit{
    width:100%;
    height:42px;
    border:none;
    border-radius:999px;
    background:linear-gradient(120deg, var(--blue), var(--pink));
    color:#fff;
    font-size:14px;
    font-weight:500;
    letter-spacing:.05em;
    cursor:pointer;
    font-family:'Noto Sans SC', sans-serif;
  }
  .auth-switch{
    margin-top:20px;
    font-size:12.5px;
    color:var(--muted);
  }
  .auth-switch a{ color:var(--blue-deep); text-decoration:none; }

  .auth-back{
    margin-top:22px;
    font-size:12.5px;
    color:var(--muted);
    text-decoration:none;
  }
  .auth-back:hover{ color:var(--blue-deep); }

  /* ================= 个人中心：保留完整导航栏 + 单页分区 ================= */
  .navbar{
    max-width:1100px;
    margin:20px auto 0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    padding:14px 28px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:var(--shadow);
  }
  .nav-left{ display:flex; align-items:center; gap:28px; }
  .brand{ font-family:'Noto Serif SC', serif; font-size:19px; font-weight:500; color:var(--ink); text-decoration:none; }
  .brand .dot{ color:var(--pink); }
  .nav-links{ display:flex; gap:22px; }
  .nav-links a{ font-size:14px; color:var(--ink-soft); text-decoration:none; }
  .nav-links a.active{ color:var(--pink); font-weight:500; }
  .nav-right{ display:flex; align-items:center; gap:12px; }
  .icon-btn{ width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background:#fff; display:flex; align-items:center; justify-content:center; color:var(--ink-soft); }
  .icon-btn svg{ width:16px; height:16px; }

  .uc-page{
    max-width:720px;
    margin:0 auto;
    padding:48px 24px 100px;
  }
  .uc-page h1{
    font-family:'Noto Serif SC', serif;
    font-size:26px;
    font-weight:500;
    margin:0 0 40px;
  }

  .section-label{
    display:flex; align-items:center; gap:14px; margin-bottom:18px;
  }
  .section-label .dash{ width:28px; height:1px; background:var(--pink); }
  .section-label .text{
    font-family:'Noto Serif SC', serif;
    font-size:18px; font-weight:500; color:var(--ink-soft);
  }

  .uc-card{
    background:var(--card-bg);
    border:1px solid var(--line);
    border-radius:16px;
    padding:28px 30px;
    margin-bottom:48px;
  }

  /* 头像+资料 */
  .profile-row{ display:flex; gap:26px; align-items:flex-start; }
  .avatar-edit{ position:relative; flex:0 0 auto; cursor:pointer; }
  .avatar-edit .avatar{
    width:88px; height:88px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(150deg, var(--blue), var(--pink));
    box-shadow:var(--shadow);
  }
  .avatar-edit .avatar span{ font-family:'Noto Serif SC', serif; font-size:30px; color:#fff; font-weight:500; }
  .avatar-edit .overlay{
    position:absolute; inset:0; border-radius:50%;
    background:rgba(47,43,39,.55);
    color:#fff; font-size:11px;
    display:flex; align-items:center; justify-content:center;
    opacity:0; transition:opacity .2s ease;
  }
  .avatar-edit:hover .overlay{ opacity:1; }

  .profile-fields{ flex:1; }
  .profile-fields .auth-field{ margin-bottom:14px; }
  .profile-fields textarea{
    width:100%; min-height:64px; border-radius:10px; border:1px solid var(--line);
    background:var(--paper); padding:10px 14px; font-size:13.5px; color:var(--ink);
    font-family:'Noto Sans SC', sans-serif; resize:vertical; outline:none;
  }
  .save-btn{
    margin-top:6px;
    padding:8px 22px;
    border-radius:999px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink-soft);
    font-size:13px;
    cursor:pointer;
    transition:border-color .2s ease, color .2s ease;
  }
  .save-btn:hover{ border-color:var(--blue); color:var(--blue-deep); }

  /* 修改密码 */
  .pw-grid{ display:grid; gap:14px; max-width:340px; }
  .pw-grid .auth-field{ margin-bottom:0; }

  /* 我的评论 */
  .comment-item{
    padding:16px 0;
    border-bottom:1px solid var(--line);
  }
  .comment-item:last-child{ border-bottom:none; padding-bottom:0; }
  .comment-text{ font-size:14px; color:var(--ink); margin-bottom:6px; }
  .comment-meta{ font-size:12px; color:var(--muted); }
  .comment-meta a{ color:var(--blue-deep); text-decoration:none; }

  @media (max-width:640px){
    .navbar{ padding:12px 18px; }
    .nav-links{ display:none; }
    .profile-row{ flex-direction:column; align-items:center; text-align:center; }
  }
</style>
</head>
<body>

  <div class="demo-switch">
    <button data-view="login" class="active">登录</button>
    <button data-view="register">注册</button>
    <button data-view="uc">个人中心</button>
  </div>

  <!-- ============ 登录 ============ -->
  <div class="view active" id="view-login">
    <div class="authpage">
      <div class="deco-dot" style="top:16%; left:14%;"></div>
      <div class="deco-dot" style="bottom:20%; right:16%; width:4px; height:4px;"></div>
      <div class="auth-card">
        <div class="auth-brand">雨滴<span class="dot">.</span></div>
        <div class="auth-tagline">个人博客</div>

        <div class="auth-field">
          <label>用户名 / 邮箱</label>
          <input type="text" placeholder="请输入用户名或邮箱" />
        </div>
        <div class="auth-field">
          <label>密码</label>
          <input type="password" placeholder="请输入密码" />
        </div>

        <div class="auth-row">
          <label><input type="checkbox" />记住我</label>
          <a href="#">忘记密码？</a>
        </div>

        <button class="auth-submit">登 录</button>

        <div class="auth-switch">还没有账号？<a href="#" onclick="switchView('register');return false;">去注册</a></div>
      </div>
      <a class="auth-back" href="#">← 返回首页</a>
    </div>
  </div>

  <!-- ============ 注册 ============ -->
  <div class="view" id="view-register">
    <div class="authpage">
      <div class="deco-dot" style="top:18%; right:15%;"></div>
      <div class="deco-dot" style="bottom:22%; left:17%; width:4px; height:4px;"></div>
      <div class="auth-card">
        <div class="auth-brand">雨滴<span class="dot">.</span></div>
        <div class="auth-tagline">加入我们</div>

        <div class="auth-field">
          <label>用户名</label>
          <input type="text" placeholder="给自己起个名字" />
        </div>
        <div class="auth-field">
          <label>邮箱</label>
          <input type="email" placeholder="用于登录和找回密码" />
        </div>
        <div class="auth-field">
          <label>密码</label>
          <input type="password" placeholder="至少 8 位" />
        </div>
        <div class="auth-field" style="margin-bottom:24px;">
          <label>确认密码</label>
          <input type="password" placeholder="再输入一次密码" />
        </div>

        <button class="auth-submit">注 册</button>

        <div class="auth-switch">已有账号？<a href="#" onclick="switchView('login');return false;">去登录</a></div>
      </div>
      <a class="auth-back" href="#">← 返回首页</a>
    </div>
  </div>

  <!-- ============ 个人中心 ============ -->
  <div class="view" id="view-uc">
    <header class="navbar">
      <div class="nav-left">
        <a class="brand">雨滴<span class="dot">.</span></a>
        <nav class="nav-links">
          <a>全部</a><a>技术分享</a><a>读书感悟</a><a>生活札记</a><a>归档</a><a>关于</a>
        </nav>
      </div>
      <div class="nav-right">
        <button class="icon-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3" stroke-linecap="round"/></svg></button>
        <button class="icon-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 14.5A8.5 8.5 0 119.5 4 7 7 0 0020 14.5z" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </header>

    <div class="uc-page">
      <h1>个人中心</h1>

      <!-- 头像 + 资料 -->
      <div class="section-label"><span class="dash"></span><span class="text">头像与资料</span></div>
      <div class="uc-card">
        <div class="profile-row">
          <div class="avatar-edit">
            <div class="avatar"><span>雨</span></div>
            <div class="overlay">更换头像</div>
          </div>
          <div class="profile-fields">
            <div class="auth-field">
              <label>昵称</label>
              <input type="text" value="雨滴" />
            </div>
            <div class="auth-field" style="margin-bottom:10px;">
              <label>简介</label>
              <textarea placeholder="写点关于自己的介绍…">写 Java 起家，后来也用 Python 和 Go 写过一些东西。</textarea>
            </div>
            <button class="save-btn">保存修改</button>
          </div>
        </div>
      </div>

      <!-- 修改密码 -->
      <div class="section-label"><span class="dash"></span><span class="text">修改密码</span></div>
      <div class="uc-card">
        <div class="pw-grid">
          <div class="auth-field"><label>当前密码</label><input type="password" /></div>
          <div class="auth-field"><label>新密码</label><input type="password" /></div>
          <div class="auth-field"><label>确认新密码</label><input type="password" /></div>
        </div>
        <button class="save-btn" style="margin-top:16px;">提交修改</button>
      </div>

      <!-- 我的评论 -->
      <div class="section-label"><span class="dash"></span><span class="text">我的评论</span></div>
      <div class="uc-card">
        <div class="comment-item">
          <div class="comment-text">"这段关于并发控制的分析很清楚，学到了。"</div>
          <div class="comment-meta">评论于《<a href="#">Java 高并发下的锁优化</a>》 · 2026-09-10</div>
        </div>
        <div class="comment-item">
          <div class="comment-text">"祥子的悲剧确实让人唏嘘，写得很有感触。"</div>
          <div class="comment-meta">评论于《<a href="#">《骆驼祥子》：祥子最后失去的，不只是一辆车</a>》 · 2026-09-08</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function switchView(name){
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById('view-' + name).classList.add('active');
      document.querySelectorAll('.demo-switch button').forEach(b => b.classList.toggle('active', b.dataset.view === name));
    }
    document.querySelectorAll('.demo-switch button').forEach(btn => {
      btn.addEventListener('click', () => switchView(btn.dataset.view));
    });
  </script>

</body>
</html>
