<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雨滴·手记 — 欢迎页 Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..900&family=Noto+Serif+SC:wght@400;600&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root[data-theme="light"] {
    --bg: #faf7f2;
    --bg-soft: #f4efe7;
    --ink: #2c2825;
    --ink-soft: #6f665d;
    --sakura: #e78ea0;
    --sakura-deep: #d66d84;
    --lake: #6fa3ac;
    --lake-deep: #4d8892;
    --line: rgba(44, 40, 37, 0.1);
  }
  :root[data-theme="dark"] {
    --bg: #1c1a19;
    --bg-soft: #242220;
    --ink: #ece7e1;
    --ink-soft: #a89f96;
    --sakura: #e895a6;
    --sakura-deep: #f0a9b8;
    --lake: #7fb5bd;
    --lake-deep: #9bcbd2;
    --line: rgba(236, 231, 225, 0.12);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans SC", -apple-system, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
    transition: background 0.5s ease, color 0.5s ease;
  }

  /* ---------- 头部 ---------- */
  header {
    position: relative;
    z-index: 10;
    max-width: 1180px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 36px 56px;
    border-bottom: 1px solid var(--line);
  }
  .brand {
    font-family: "Noto Serif SC", serif;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--ink);
  }
  .icon-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink-soft);
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
  }
  .icon-btn:hover {
    border-color: var(--lake);
    color: var(--lake-deep);
    transform: rotate(15deg);
  }

  /* ---------- 左上角樱花枝干 ---------- */
  .branch-corner {
    position: absolute;
    top: 0;
    left: 0;
    width: 340px;
    height: 340px;
    z-index: 1;
    pointer-events: none;
    opacity: 0.9;
  }
  .branch-corner .branch {
    fill: none;
    stroke: var(--sakura);
    stroke-linecap: round;
    opacity: 0.55;
  }
  .branch-corner .petal {
    fill: var(--sakura);
  }

  /* 零散飘落花瓣 */
  .petal-field {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
  }
  .drift-petal {
    position: absolute;
    animation: drift linear infinite;
    opacity: 0;
  }
  .drift-petal svg {
    display: block;
    fill: var(--sakura);
    opacity: 0.55;
  }
  @keyframes drift {
    0%   { transform: translateY(-5vh) translateX(0) rotate(0deg); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 0.85; }
    100% { transform: translateY(105vh) translateX(30px) rotate(320deg); opacity: 0; }
  }

  /* ---------- 水波纹背景层（围绕按钮） ---------- */
  .ripple-field {
    position: absolute;
    top: 60%;
    left: 50%;
    width: 1px;
    height: 1px;
    z-index: 0;
    pointer-events: none;
  }
  .ripple {
    position: absolute;
    top: 0;
    left: 0;
    border: 1px solid var(--lake);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    animation: ripple-breathe 7s ease-out infinite;
    opacity: 0;
  }
  .ripple:nth-child(1) { animation-delay: 0s; }
  .ripple:nth-child(2) { animation-delay: 1.75s; }
  .ripple:nth-child(3) { animation-delay: 3.5s; }
  .ripple:nth-child(4) { animation-delay: 5.25s; }
  @keyframes ripple-breathe {
    0%   { width: 20px;  height: 20px;  opacity: 0.32; }
    70%  { opacity: 0.08; }
    100% { width: 1400px; height: 1400px; opacity: 0; }
  }

  /* ---------- 底部大海水浪层 ---------- */
  .sea {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 160px;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .wave-layer {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 200%;
    height: 100%;
    background: var(--lake);
    -webkit-mask-repeat: repeat-x;
    mask-repeat: repeat-x;
    -webkit-mask-size: 400px 100%;
    mask-size: 400px 100%;
    -webkit-mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 60' preserveAspectRatio='none'><path d='M0,30 C50,23 150,23 200,30 C250,37 350,37 400,30 L400,60 L0,60 Z'/></svg>");
    mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 60' preserveAspectRatio='none'><path d='M0,30 C50,23 150,23 200,30 C250,37 350,37 400,30 L400,60 L0,60 Z'/></svg>");
    animation: wave-scroll 34s linear infinite;
  }
  .wave-layer.back {
    bottom: 10px;
    height: 85%;
    opacity: 0.12;
    animation-duration: 46s;
    animation-direction: reverse;
  }
  .wave-layer.front {
    opacity: 0.2;
  }
  @keyframes wave-scroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-400px); }
  }

  /* ---------- 主体内容 ---------- */
  .welcome {
    position: relative;
    z-index: 5;
    min-height: calc(100vh - 110px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 24px;
  }

  .welcome-brand {
    font-family: "Noto Serif SC", serif;
    font-size: clamp(52px, 9vw, 80px);
    font-weight: 600;
    letter-spacing: 0.05em;
    color: var(--ink);
    opacity: 0;
    animation: fade-up 0.9s ease forwards 0.15s;
  }
  .welcome-brand .dot {
    color: var(--sakura-deep);
  }

  .welcome-line {
    margin-top: 26px;
    font-family: "Fraunces", "Noto Serif SC", serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(16px, 2.4vw, 20px);
    color: var(--ink-soft);
    letter-spacing: 0.02em;
    opacity: 0;
    animation: fade-up 0.9s ease forwards 0.4s;
  }

  .enter-btn {
    margin-top: 48px;
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 14px 34px;
    border: 1px solid var(--lake);
    border-radius: 999px;
    color: var(--lake-deep);
    text-decoration: none;
    font-size: 15px;
    letter-spacing: 0.03em;
    background: transparent;
    overflow: hidden;
    opacity: 0;
    animation: fade-up 0.9s ease forwards 0.65s;
    transition: color 0.35s ease, border-color 0.35s ease, transform 0.3s ease;
  }
  .enter-btn:hover {
    color: var(--bg);
    border-color: var(--lake-deep);
    transform: translateY(-2px);
  }
  .enter-btn::before {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--lake-deep);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.4s ease;
    z-index: -1;
    border-radius: 999px;
  }
  .enter-btn:hover::before {
    transform: scaleX(1);
  }
  .enter-btn .arrow {
    transition: transform 0.3s ease;
  }
  .enter-btn:hover .arrow {
    transform: translateX(4px);
  }

  @keyframes fade-up {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  footer {
    position: relative;
    z-index: 5;
    text-align: center;
    padding: 20px;
    font-size: 12px;
    color: var(--ink-soft);
    opacity: 0.6;
  }

  @media (max-width: 640px) {
    header { padding: 24px 20px; }
    .branch-corner { width: 220px; height: 220px; }
    .sea { height: 100px; }
  }
</style>
</head>
<body>

  <div class="petal-field" id="petalField"></div>

  <svg class="ripple-field" aria-hidden="true">
    <circle class="ripple"></circle>
    <circle class="ripple"></circle>
    <circle class="ripple"></circle>
    <circle class="ripple"></circle>
  </svg>

  <div class="sea" aria-hidden="true">
    <div class="wave-layer back"></div>
    <div class="wave-layer front"></div>
  </div>

  <svg class="branch-corner" viewBox="0 0 340 340" aria-hidden="true">
    <defs>
      <path id="petalShape" d="M14,4 C9,7 6,12 6.5,17 C7,23 11,28 15.4,30 C15.6,30.15 16.4,30.15 16.6,30 C21,28 25,23 25.5,17 C26,12 23,7 18,4 C17.3,5.6 16.6,6.4 16,6.4 C15.4,6.4 14.7,5.6 14,4 Z"/>
    </defs>
    <path class="branch" d="M -10 40 C 40 55, 80 70, 110 105 C 140 140, 130 190, 160 230" stroke-width="2"/>
    <path class="branch" d="M 60 75 C 85 80, 105 95, 118 118" stroke-width="1.2"/>
    <path class="branch" d="M 95 130 C 115 132, 132 142, 142 160" stroke-width="1.2"/>
    <path class="branch" d="M 20 20 C 45 25, 65 38, 78 58" stroke-width="1"/>

    <use href="#petalShape" class="petal" transform="translate(6,4) scale(0.75) rotate(-10,16,16)" opacity="0.85"/>
    <use href="#petalShape" class="petal" transform="translate(64,45) scale(0.62) rotate(35,16,16)" opacity="0.75"/>
    <use href="#petalShape" class="petal" transform="translate(104,102) scale(0.5) rotate(70,16,16)" opacity="0.65"/>
    <use href="#petalShape" class="petal" transform="translate(128,144) scale(0.42) rotate(15,16,16)" opacity="0.55"/>
    <use href="#petalShape" class="petal" transform="translate(148,214) scale(0.55) rotate(-25,16,16)" opacity="0.5"/>
    <use href="#petalShape" class="petal" transform="translate(30,-2) scale(0.36) rotate(50,16,16)" opacity="0.6"/>
    <use href="#petalShape" class="petal" transform="translate(86,80) scale(0.32) rotate(-40,16,16)" opacity="0.5"/>
  </svg>

  <header>
    <div class="brand">雨滴<span style="opacity:.6">·手记</span></div>
    <button class="icon-btn" id="themeToggle" title="切换主题" type="button">☾</button>
  </header>

  <section class="welcome">
    <h1 class="welcome-brand">雨滴<span class="dot">.</span></h1>
    <p class="welcome-line">微小如雨滴，也要奔赴自己的海。</p>
    <a class="enter-btn" href="#">
      <span>进入博客</span>
      <span class="arrow">→</span>
    </a>
  </section>

  <footer>© 2026 雨滴·手记</footer>

<script>
  // 主题切换
  const root = document.documentElement;
  const toggle = document.getElementById('themeToggle');
  const stored = localStorage.getItem('yudi-theme-demo');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  root.setAttribute('data-theme', stored === 'dark' || (!stored && prefersDark) ? 'dark' : 'light');
  toggle.textContent = root.getAttribute('data-theme') === 'dark' ? '☀' : '☾';

  toggle.addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    localStorage.setItem('yudi-theme-demo', next);
    toggle.textContent = next === 'dark' ? '☀' : '☾';
  });

  // 零散飘落花瓣（使用真实花瓣轮廓，而非圆点）
  const PETAL_PATH = "M14,4 C9,7 6,12 6.5,17 C7,23 11,28 15.4,30 C15.6,30.15 16.4,30.15 16.6,30 C21,28 25,23 25.5,17 C26,12 23,7 18,4 C17.3,5.6 16.6,6.4 16,6.4 C15.4,6.4 14.7,5.6 14,4 Z";
  const NS = 'http://www.w3.org/2000/svg';
  const field = document.getElementById('petalField');
  const COUNT = 12;
  for (let i = 0; i < COUNT; i++) {
    const wrap = document.createElement('div');
    wrap.className = 'drift-petal';
    const size = 7 + Math.random() * 6;
    wrap.style.left = Math.random() * 100 + 'vw';
    wrap.style.animationDuration = (14 + Math.random() * 10) + 's';
    wrap.style.animationDelay = (Math.random() * 14) + 's';

    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '0 0 32 32');
    svg.setAttribute('width', size);
    svg.setAttribute('height', size);
    svg.style.transform = `rotate(${Math.floor(Math.random() * 360)}deg)`;
    const path = document.createElementNS(NS, 'path');
    path.setAttribute('d', PETAL_PATH);
    svg.appendChild(path);
    wrap.appendChild(svg);
    field.appendChild(wrap);
  }
</script>

</body>
</html>
