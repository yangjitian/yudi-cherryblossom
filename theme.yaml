apiVersion: theme.halo.run/v1alpha1
kind: Theme
metadata:
  name: yudi-cherryblossom
spec:
  displayName: 雨滴·手记
  author:
    name: Yudi
    website: https://github.com/yangjitian
  description: 冷淡简约 + 樱花粉 / 湖水蓝点缀的 Halo 2.x 主题。
  logo: https://raw.githubusercontent.com/yangjitian/yudi-cherryblossom/main/docs/logo.png
  homepage: https://github.com/yangjitian/yudi-cherryblossom
  repo: https://github.com/yangjitian/yudi-cherryblossom.git
  issues: https://github.com/yangjitian/yudi-cherryblossom/issues
  settingName: yudi-cherryblossom-setting
  configMapName: yudi-cherryblossom-configMap
  customTemplates:
    page:
      - name: 关于
        description: 作者介绍与联系方式页面
        screenshot:
        file: page_about.html
      - name: 搜索
        description: 站内搜索结果页面
        screenshot:
        file: search.html
  version: "1.0.7"
  requires: ">=2.0.0"
  license:
    - name: "GPL-3.0"
      url: "https://www.gnu.org/licenses/gpl-3.0.en.html"
